<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AcademyOS API Reference</title>
  </head>
  <body>
    <div id="app"></div>
    <!--
      Rendered from academyos.json, a link to /openapi/academyos.json, the
      public API's OpenAPI document generated by the AcademyOS server.
      Scalar is pinned for reproducible docs.
    -->
    <script type="module">
      import { createApiReference } from 'https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.76.0/esm.js'

      createApiReference('#app', {
        metaData: { title: 'AcademyOS API Reference' },
        url: 'academyos.json',
        // Calls need a real API key; keep keys out of the browser.
        hideTestRequestButton: true,
        defaultHttpClient: { targetKey: 'shell', clientKey: 'curl' },
      })
    </script>
  </body>
</html>
